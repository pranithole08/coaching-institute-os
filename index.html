<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f7d5d'/%3E%3Cpath d='M16 8l9 4.5-9 4.5-9-4.5L16 8z' fill='%23fff'/%3E%3Cpath d='M10 15.5V20c0 2 2.7 3.5 6 3.5s6-1.5 6-3.5v-4.5l-6 3-6-3z' fill='%23fff' opacity='.85'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#2f7d5d" />
    <title>Coaching Institute OS</title>
    <script>
      // Apply the saved theme before first paint so the app never flashes light.
      (function () {
        try {
          var stored = localStorage.getItem('ci_theme') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
